# Free-only judge demo. Never upgrade or add billing to deploy this Blueprint.
services:
  - type: web
    name: phantom-vox-sih-2026
    runtime: docker
    region: singapore
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: PHANTOM_VOX_ENVIRONMENT
        value: production
      - key: PHANTOM_VOX_DATABASE_URL
        fromDatabase:
          name: phantom-vox-db
          property: connectionString
      - key: PHANTOM_VOX_JWT_SECRET
        generateValue: true
      - key: PHANTOM_VOX_CORS_ORIGINS
        value: '[]'
      - key: PHANTOM_VOX_DEMO_MODE
        value: 'true'
      - key: PHANTOM_VOX_SEED_DEMO_DATA
        value: 'true'
      - key: PHANTOM_VOX_REQUIRE_ML
        value: 'true'
      - key: PHANTOM_VOX_RETAIN_RAW_AUDIO
        value: 'false'
databases:
  - name: phantom-vox-db
    region: singapore
    plan: free
    postgresMajorVersion: '17'
    databaseName: phantomvox
    ipAllowList: []
