name: SIH demo cloud check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/demo-cloud-check.yml'
      - 'scripts/check_deployment.py'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1 websockets==16.0
      - name: Wait for healthy cloud deployment
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 20 https://phantom-vox-sih-2026.onrender.com/api/v1/health > /tmp/phantom-health.json; then
              cat /tmp/phantom-health.json
              exit 0
            fi
            sleep 10
          done
          echo 'Cloud health check did not become ready.'
          exit 1
      - name: Verify website, login, WebSockets, detection and real model inference
        run: python scripts/check_deployment.py https://phantom-vox-sih-2026.onrender.com
